[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condition-ouvriere-corpus"
version = "0.1.0"
description = "Reproducible French corpus of Simone Weil's La Condition ouvrière (Gallimard, 1951)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code); CC BY-SA 4.0 (transcription-derived corpus)" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.13,<2",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

