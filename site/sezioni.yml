# Struttura interna dei capitoli del sito italiano.
#
# Questo file NON modifica il corpus: descrive soltanto come `scripts/build_site.py`
# deve suddividere i testi lunghi quando genera `site/testi/*.qmd`.
#
# Chiavi ammesse per ciascun testo (tutte facoltative):
#
#   sigla: parte-di-url
#       Sostituisce la parte di URL ricavata automaticamente dal titolo,
#       utile per i titoli molto lunghi.
#
#   livello_titoli_originali: 2 | 3
#       Livello a cui portare i titoletti `####` già presenti nel corpus.
#       Valore predefinito: 2.
#
#   promuovi: [prefisso, ...]
#       Titoletti originali da forzare al livello 2 (prevale su quanto sopra).
#
#   subordina: [prefisso, ...]
#       Titoletti originali da forzare al livello 3 (prevale su quanto sopra).
#
#   blocchi: [titolo | ~, ...]
#       Titolo editoriale per ciascun blocco separato da una riga `---`
#       (le lettere raccolte in un unico testo). `~` lascia il blocco
#       così com’è, perché ha già un titolo suo.
#
#   sezioni: [{prima_di: prefisso, titolo: ..., occorrenza: n}, ...]
#       Titolo editoriale inserito prima del paragrafo che comincia con
#       `prima_di`. `occorrenza` serve solo se il prefisso non è unico.
#
# I titoli editoriali sono resi con la classe CSS `.sez-ed` e sono
# dichiarati come tali nella pagina "Nota al testo".

