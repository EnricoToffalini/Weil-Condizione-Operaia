project:
  type: book
  # Il sito reso finisce in docs/, la cartella che GitHub Pages pubblica.
  output-dir: ../docs
  resources:
    - .nojekyll
    - robots.txt

lang: it-IT

# La traduzione italiana di Quarto non copre l'etichetta del pulsante di
# scaricamento, che resterebbe in inglese.
language:
  tools-download: "Scarica"

book:
  title: "La Condizione Operaia"
  subtitle: "Traduzione italiana dell'edizione Gallimard 1951"
  author: "Simone Weil"
  # Indirizzo pubblico su GitHub Pages. Serve a Quarto per generare
  # docs/sitemap.xml, gli URL canonici e i tag Open Graph / Twitter.
  site-url: "https://enricotoffalini.github.io/Weil-Condizione-Operaia/"
  repo-url: "https://github.com/EnricoToffalini/Weil-Condizione-Operaia"
  description: >-
    Traduzione italiana integrale dei sedici scritti di Simone Weil raccolti da
    Albert Camus in «La Condition ouvrière» (Gallimard, Parigi 1951): lettere,
    il diario dell'anno di fabbrica 1934-1935, frammenti, articoli e saggi sulla
    condizione operaia, la fatica, l'alienazione e il senso del lavoro.
  cover-image: _immagini/cover.jpg
  image: _immagini/cover.jpg
  favicon: _immagini/cover.png
  # Nome del PDF del libro: docs/la-condizione-operaia.pdf
  output-file: "la-condizione-operaia"
  # Mette il link di scaricamento del PDF nella barra laterale del sito.
  downloads: [pdf]
  search: true
  sidebar:
    title: "La Condizione Operaia - Simone Weil"
    style: docked
  page-footer:
    left: "Simone Weil, *La Condizione Operaia*, Gallimard, Parigi 1951."
    right: "Traduzione italiana &middot; testo derivato da Wikisource, CC BY-SA 4.0."
  chapters:
    - index.qmd
    - testi/02-tre-lettere-alla-signora-albertine-thevenon.qmd
    - testi/03-lettera-a-un-allieva.qmd
    - testi/04-lettera-a-boris-souvarine.qmd
    - testi/05-frammento-di-lettera-a-x.qmd
    - testi/06-diario-di-fabbrica.qmd
    - testi/07-frammenti.qmd
    - testi/08-lettere-a-un-ingegnere-direttore-di-fabbrica.qmd
    - testi/09-la-vita-e-lo-sciopero-delle-operaie-metallurgiche.qmd
    - testi/10-lettera-aperta-a-un-iscritto-al-sindacato.qmd
    - testi/11-lettere-ad-auguste-detoeuf.qmd
    - testi/12-osservazioni-sui-conflitti-del-nord.qmd
    - testi/13-principi-di-un-nuovo-regime-interno.qmd
    - testi/14-la-razionalizzazione.qmd
    - testi/15-la-condizione-operaia.qmd
    - testi/16-esperienza-della-vita-di-fabbrica.qmd
    - testi/17-condizione-prima-di-un-lavoro-non-servile.qmd
    - nota-al-testo.qmd

# Metadati bibliografici: Quarto li rende come tag Highwire/Dublin Core e come
# blocco citazione, utili a Google Scholar e alle anteprime.
citation:
  type: book
  title: "La Condizione Operaia"
  author: "Simone Weil"
  publisher: "Gallimard"
  publisher-place: "Parigi"
  issued: 1951
  language: it
  url: "https://enricotoffalini.github.io/Weil-Condizione-Operaia/"

format:
  html:
    theme: cosmo
    css: styles.css
    open-graph: true
    twitter-card:
      card-style: summary_large_image
    # Emette i tag <meta name="citation_*"> per Google Scholar e simili.
    google-scholar: true
    include-in-header:
      text: |
        <script data-goatcounter="https://weil.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Book",
          "name": "La Condizione Operaia",
          "author": { "@type": "Person", "name": "Simone Weil" },
          "translator": "GPT-5.6 Sol; Claude Opus 5.0",
          "inLanguage": "it",
          "isBasedOn": "https://fr.wikisource.org/wiki/La_Condition_ouvri%C3%A8re",
          "publisher": { "@type": "Organization", "name": "Gallimard" },
          "datePublished": "1951",
          "license": "https://creativecommons.org/licenses/by-sa/4.0/",
          "url": "https://enricotoffalini.github.io/Weil-Condizione-Operaia/"
        }
        </script>
    include-after-body: _includes/mobile-html.html
    toc: true
    toc-depth: 3
    toc-title: "Contenuti"
    number-sections: false
    grid:
      body-width: 760px
    anchor-sections: true
    link-external-newwindow: true
    fig-responsive: true

  # Versione libro, pagina A5 (148 x 210 mm), pensata per la lettura a schermo
  # e per la stampa casalinga in fascicoli.
  pdf:
    # Porta in locale le immagini di Wikimedia: LaTeX non sa leggere un file
    # scaricato senza estensione. Vedi il commento in testa al filtro.
    filters:
      - _filtri/struttura-pdf.lua
      - _filtri/immagini-pdf.lua
      - _filtri/formule-wikisource.lua
      - _filtri/simboli-matematici.lua
    # Wikimedia rifiuta le richieste senza un User-Agent riconoscibile e
    # risponde con un messaggio di testo al posto dell'immagine.
    request-headers:
      - ["User-Agent", "quarto-render (La Condizione Operaia, edizione italiana)"]
    documentclass: scrbook
    classoption: [oneside]
    papersize: a5
    # Margini un po' più larghi del minimo: in A5 la giustezza resta piena
    # ma il testo non arriva a ridosso del taglio. `footskip` è la distanza
    # fra il fondo dello specchio e la riga del numero di pagina: tenendola
    # sotto al margine inferiore, il numero resta staccato dal fondo foglio
    # (con il valore calcolato da geometry ci finiva quasi a contatto).
    geometry:
      - a5paper
      - inner=18mm
      - outer=16mm
      - top=18mm
      - bottom=22mm
      - footskip=32pt
    # Corpo del testo: mezzo punto in più del precedente 10.5pt, ancora
    # compatibile con la compattezza della pagina A5.
    fontsize: 11.5pt
    linestretch: 1.06
    indent: true
    toc: true
    toc-depth: 1
    toc-title: "Indice"
    number-sections: false
    colorlinks: true
    linkcolor: black
    urlcolor: black
    include-in-header:
      text: |
        % Linux Libertine (in dotazione a TinyTeX) al posto del Latin Modern
        % predefinito: fra i caratteri già disponibili è l'unico che copra il
        % greco politonico dell'epigrafe del Diario e l'asterisco triplo degli
        % stacchi. I nomi sono quelli dei file, che TeX trova da sé: il nome
        % della famiglia richiederebbe il carattere installato nel sistema.
        \setmainfont{LinLibertine_R.otf}[
          ItalicFont     = LinLibertine_RI.otf,
          BoldFont       = LinLibertine_RB.otf,
          BoldItalicFont = LinLibertine_RBI.otf]
        \setsansfont{LinBiolinum_R.otf}[
          ItalicFont     = LinBiolinum_RI.otf,
          BoldFont       = LinBiolinum_RB.otf,
          BoldItalicFont = LinBiolinum_RBO.otf]
        % Sfondo della sola pagina di copertina. In scrbook `\maketitle`
        % apre internamente una titlepage: uno sfondo `*` verrebbe consumato
        % dal cambio pagina iniziale. Lo teniamo quindi attivo per tutta
        % l'esecuzione di `\maketitle` e lo rimuoviamo subito dopo.
        % Il PNG resta archiviato accanto al JPG ma non viene usato.
        \usepackage{eso-pic}
        \AddToHook{cmd/maketitle/before}{%
          \AddToShipoutPictureBG{%
            \AtPageLowerLeft{%
              \includegraphics[width=\paperwidth,height=\paperheight]{%
                \detokenize{_immagini/cover.jpg}}}}}
        \AddToHook{cmd/maketitle/after}{\ClearShipoutPictureBG}
        % Titolo di copertina piu' grande. In scrbook la dimensione e' fissata
        % da un `\huge` che `\maketitle` applica dopo il font di `title`: un
        % `\setkomafont{title}` verrebbe quindi annullato. Nella titlepage
        % `\huge` compare soltanto davanti al titolo, percio' lo ridefiniamo
        % per la sola durata di `\maketitle`.
        \AddToHook{cmd/maketitle/before}{%
          \let\hugeoriginale\huge
          \renewcommand{\huge}{\fontsize{28pt}{32pt}\selectfont}}
        \AddToHook{cmd/maketitle/after}{\let\huge\hugeoriginale}
        % Le tabelle del diario e dei frammenti hanno molte colonne strette:
        % in A5 stanno nella giustezza solo in corpo minore.
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\scriptsize}
        % Nella giustezza stretta dell'A5 le parole non spezzabili (i nomi di
        % file della nota al testo, le sigle, i numeri) sborderebbero nel
        % margine: meglio qualche riga con gli spazi un po' larghi.
        \setlength{\emergencystretch}{3em}
        \sloppy
        % Le voci dell'indice sono sedici e parecchie vanno a capo: con lo
        % stacco predefinito di scrbook (1em fra un capitolo e l'altro)
        % l'ultima riga sconfinava nella pagina seguente. Comprimendo solo
        % lo spazio fra le voci l'indice torna in una pagina sola.
        \DeclareTOCStyleEntry[beforeskip=.2em]{chapter}{chapter}
