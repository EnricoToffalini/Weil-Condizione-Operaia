<script>
document.addEventListener("DOMContentLoaded", () => {
  const main = document.querySelector("#quarto-document-content");
  if (!main) return;

  // Quarto nasconde l'indice nel margine sotto i 992 px. Ne crea una copia
  // accessibile e compatta, senza duplicare gli id del documento.
  const sourceToc = document.querySelector("#quarto-margin-sidebar #TOC");
  if (sourceToc?.querySelector("a")) {
    const mobileToc = document.createElement("div");
    mobileToc.id = "co-mobile-toc";

    const bar = document.createElement("div");
    bar.className = "co-mobile-toc-bar";

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "co-mobile-toc-toggle";
    toggle.textContent = "Contenuti";
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-controls", "co-mobile-toc-panel");

    const panel = document.createElement("div");
    panel.id = "co-mobile-toc-panel";
    panel.hidden = true;

    const nav = sourceToc.cloneNode(true);
    nav.id = "TOC-mobile";
    // Evita la regola Quarto che nasconde nav[role="doc-toc"] su mobile.
    nav.removeAttribute("role");
    nav.setAttribute("aria-label", "Indice della pagina");
    nav.querySelector("#toc-title")?.remove();
    nav.querySelectorAll("[id]").forEach((element) => element.removeAttribute("id"));
    nav.querySelectorAll("ul.collapse").forEach((list) => list.classList.remove("collapse"));
    nav.querySelectorAll(".active").forEach((link) => link.classList.remove("active"));

    const setTocOpen = (open) => {
      panel.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
      if (open) bar.classList.remove("co-mobile-toc-hidden");
    };
    toggle.addEventListener("click", () => {
      setTocOpen(toggle.getAttribute("aria-expanded") !== "true");
    });
    nav.addEventListener("click", (event) => {
      if (event.target.closest("a")) setTocOpen(false);
    });

    panel.append(nav);
    bar.append(toggle, panel);
    mobileToc.append(bar);
    const titleBlock = main.querySelector("#title-block-header");
    (titleBlock ?? main).insertAdjacentElement(titleBlock ? "beforebegin" : "afterbegin", mobileToc);

    // Come la barra principale di Quarto: scompare scorrendo verso il basso
    // e riappare verso l'alto. Se il menu e' aperto resta sempre visibile.
    const mobileViewport = window.matchMedia("(max-width: 991.98px)");
    let lastTocScrollY = Math.max(0, window.scrollY);
    let tocScrollFrame = false;
    window.addEventListener("scroll", () => {
      if (tocScrollFrame || !mobileViewport.matches) return;
      tocScrollFrame = true;
      window.requestAnimationFrame(() => {
        const currentY = Math.max(0, window.scrollY);
        const movement = currentY - lastTocScrollY;

        if (!panel.hidden || currentY < 24) {
          bar.classList.remove("co-mobile-toc-hidden");
        } else if (movement > 8) {
          bar.classList.add("co-mobile-toc-hidden");
        } else if (movement < -8) {
          bar.classList.remove("co-mobile-toc-hidden");
        }

        if (Math.abs(movement) > 8 || currentY < 24) lastTocScrollY = currentY;
        tocScrollFrame = false;
      });
    }, { passive: true });
  }

  // Sul telefono le tabelle molto larghe restano disponibili, ma non
  // deformano la pagina: sono chiuse di default e scorrono quando aperte.
  const phone = window.matchMedia("(max-width: 575.98px)");
  const tablePanels = [];
  main.querySelectorAll("table").forEach((table) => {
    if (table.closest(".co-table-panel")) return;

    const panel = document.createElement("details");
    panel.className = "co-table-panel";
    const summary = document.createElement("summary");
    const scroller = document.createElement("div");
    scroller.className = "co-table-scroll";

    table.before(panel);
    panel.append(summary, scroller);
    scroller.append(table);
    tablePanels.push({ panel, summary });
  });

  const labelTable = ({ panel, summary }) => {
    summary.textContent = panel.open ? "Nascondi tabella" : "Mostra tabella";
  };
  const setTableMode = (isPhone) => {
    tablePanels.forEach((entry) => {
      entry.panel.open = !isPhone;
      labelTable(entry);
    });
  };
  tablePanels.forEach((entry) => {
    entry.panel.addEventListener("toggle", () => labelTable(entry));
  });
  setTableMode(phone.matches);
  phone.addEventListener("change", (event) => setTableMode(event.matches));
});
</script>
